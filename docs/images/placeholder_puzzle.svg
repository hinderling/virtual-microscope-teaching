<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220">
  <style>text{font-family:sans-serif}</style>
  <rect width="640" height="220" fill="#f8f9fa"/>
  <!-- experiment script block -->
  <rect x="20" y="60" width="220" height="100" rx="10" fill="#dbe9f6" stroke="#4a7fb5" stroke-width="2"/>
  <text x="130" y="100" text-anchor="middle" font-size="15" fill="#1f4e79">Your experiment script</text>
  <text x="130" y="122" text-anchor="middle" font-size="12" fill="#1f4e79">snap · analyze · decide</text>
  <text x="130" y="138" text-anchor="middle" font-size="12" fill="#1f4e79">setSLMImage</text>
  <!-- pymmcore API connector -->
  <text x="300" y="45" text-anchor="middle" font-size="13" fill="#555">pymmcore device API</text>
  <path d="M240 110 h40" stroke="#888" stroke-width="3"/>
  <!-- puzzle piece slot -->
  <g>
    <rect x="290" y="60" width="150" height="100" rx="10" fill="#eee" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="365" y="100" text-anchor="middle" font-size="13" fill="#666">swap in / out</text>
    <text x="365" y="120" text-anchor="middle" font-size="12" fill="#666">(config file only)</text>
  </g>
  <!-- two pieces -->
  <rect x="470" y="20" width="150" height="80" rx="10" fill="#d9f2d9" stroke="#3c8c3c" stroke-width="2"/>
  <text x="545" y="55" text-anchor="middle" font-size="13" fill="#205720">Virtual microscope</text>
  <text x="545" y="75" text-anchor="middle" font-size="11" fill="#205720">simulated specimen</text>
  <rect x="470" y="120" width="150" height="80" rx="10" fill="#fde2cf" stroke="#c96a1f" stroke-width="2"/>
  <text x="545" y="155" text-anchor="middle" font-size="13" fill="#8a4310">Real microscope</text>
  <text x="545" y="175" text-anchor="middle" font-size="11" fill="#8a4310">Micro-Manager hardware</text>
  <path d="M440 90 q20 0 30 -20" stroke="#3c8c3c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M440 130 q20 0 30 20" stroke="#c96a1f" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#3c8c3c"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#c96a1f"/></marker>
  </defs>
  <text x="320" y="205" text-anchor="middle" font-size="11" fill="#999">PLACEHOLDER: replace with the puzzle-piece figure</text>
</svg>
