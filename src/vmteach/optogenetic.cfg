# Channels: light source + emission filter. Presets are named after the
# fluorophore, as on a real system; what each one labels in the sample:
#   miRFP    -> H2B (nuclei, far-red)
#   mVenus   -> optoFGFR (the membrane-bound optogenetic tool)
#   mScarlet -> ERK-KTR (kinase translocation reporter: nucleus bright when
#               inactive, cytoplasm bright when active)
#   CyanStim -> the stimulation light path (images the projected pattern)
