[project]
name = "virtual-microscope-teaching"
version = "0.1.0"
description = "A minimal virtual microscope for teaching smart microscopy: light-responsive simulated cells behind the pymmcore-plus device API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Lucien Hinderling" }]
requires-python = ">=3.10"
keywords = ["microscopy", "smart-microscopy", "simulation", "teaching", "pymmcore", "optogenetics"]
classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "pymmcore-plus>=0.17.0",
    "numpy>=1.23",
    "scipy>=1.9",
    "opencv-python-headless>=4.6",
    "numba>=0.57",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
gui = [
    "napari[all]>=0.5",
    "napari-micromanager>=0.1.0",
]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/hinderling/virtual-microscope-teaching"
"Full simulator" = "https://github.com/hinderling/virtual-microscope"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vmteach"]

[tool.hatch.build]
include = [
    "src/vmteach/**/*.py",
    "src/vmteach/**/*.cfg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
